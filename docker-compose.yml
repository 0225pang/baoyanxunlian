name: baoyanxunlian

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"
    volumes:
      - question_voice_data:/app/data/question-voices

  realtime-asr:
    build:
      context: .
      target: realtime
    restart: unless-stopped
    env_file: .env
    expose:
      - "3001"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - app
      - realtime-asr
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-baoyan.xiaodaidai.tech}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Keep the legacy HTTP IP entry isolated from ACME validation on ports 80/443.
  caddy-ip:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - app
      - realtime-asr
    ports:
      - "18080:80"
    volumes:
      - ./Caddyfile.ip:/etc/caddy/Caddyfile:ro

volumes:
  caddy_data:
  caddy_config:
  question_voice_data:
